org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Flutter template flags — leave both as-is.
android.newDsl=false
android.builtInKotlin=false
# Kotlin incremental compilation is disabled to sidestep the
# "different roots" cache failure that surfaces when the project
# path and the pub cache live on different drives (gray_part_pitfalls.md §6).
kotlin.incremental=false
